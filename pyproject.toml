[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imagesorter"
version = "0.1.0"
description = "Sort images by detected tags or visual similarity."
requires-python = ">=3.11"
dependencies = [
    "ultralytics",
    "opencv-python",
    "imagehash",
    "PyYAML",
    "Pillow",
]

[project.optional-dependencies]
web = [
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "pydantic",
    "croniter",
    "piexif",
]

[project.scripts]
imagesorter = "imagesorter.__main__:main"

# The repo root holds two top-level packages (imagesorter, launcher); only
# imagesorter is a real distributable. Pin discovery so setuptools' flat-layout
# auto-detection doesn't error on the ambiguity (launcher runs from source).
[tool.setuptools.packages.find]
include = ["imagesorter*"]
